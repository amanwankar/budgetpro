apiVersion: apps/v1
kind: Deployment
metadata:
  name: budgetpro
  namespace: budgetpro
spec:
  replicas: 2

  selector:
    matchLabels:
      app: budgetpro

  template:
    metadata:
      labels:
        app: budgetpro

    spec:
      containers:
        - name: budgetpro

          image: amanwankar18/budgetpro:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"