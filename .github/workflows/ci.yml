name: BudgetPro CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test-and-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache-dependency-path: bugetpro-main/package-lock.json

      - name: Install dependencies
        working-directory: bugetpro-main
        run: npm ci

      - name: TypeScript check
        working-directory: bugetpro-main
        run: npm run lint

      - name: Build application
        working-directory: bugetpro-main
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t amanwankar/budgetpro:${{ github.sha }} ./bugetpro-main

      - name: Push Docker image
        run: docker push amanwankar/budgetpro:${{ github.sha }}